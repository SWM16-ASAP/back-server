global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "llv-api"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["__APP_METRICS_TARGET__"]
    authorization:
      type: llvk
      credentials: "__IMPORT_API_KEY__"
