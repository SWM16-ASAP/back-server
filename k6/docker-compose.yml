services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_USER=k6
      - INFLUXDB_USER_PASSWORD=k6
    volumes:
      - influxdb-data:/var/lib/influxdb

  k6:
    image: grafana/k6:latest
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./reports:/reports
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    depends_on:
      - influxdb

volumes:
  influxdb-data:

# 사용법:
# docker compose -f k6/docker-compose.yml up -d influxdb   # k6 결과 저장소 시작
# docker compose -f k6/docker-compose.yml run --rm k6 run /scripts/baseline.js
